name: terraform

on:
  pull_request:
    branches: [dev, prod]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [dev]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read

jobs:
  # Read-only: deliberately does NOT authenticate to AWS. GitHub's OIDC
  # subject claim for a pull_request-triggered job is
  # `repo:<owner>/<repo>:pull_request`, which matches neither deploy role's
  # trust condition (gha-bloggerbear-dev-deploy trusts
  # `ref:refs/heads/dev`; gha-bloggerbear-prod-deploy trusts
  # `environment:production`) -- there is deliberately no third role for
  # this.
  #
  # Bugfix: this job used to also run `terraform plan` (with `-backend=false
  # -refresh=false -lock=false`), on the theory that a throwaway local plan
  # wouldn't need real AWS access. That's wrong on two counts, both
  # confirmed by reproducing this exact job in a genuinely credential-less
  # sandbox: (1) `init -backend=false` leaves the working directory in a
  # state where a later `plan` refuses to run at all ("Backend
  # initialization required"), since the config still declares a real
  # `backend "s3" {...}` block; (2) even past that, this project's
  # Terraform config reads `data.aws_caller_identity.current` (used to
  # build ARN strings without creating a resource-reference dependency
  # cycle -- see infra/environments/*/main.tf's own comment on it) and the
  # AWS provider itself validates credentials on init, so `plan` cannot
  # succeed without live AWS access -- which this job deliberately never
  # has. Rather than opening a new OIDC trust path for pull_request-
  # triggered runs just to make PR-time plans possible, this job now
  # stops at `fmt`/`validate` (genuine syntax/type/schema checking, no AWS
  # calls needed) -- real plan diffs still happen for real at apply time
  # (dev auto-apply on merge, production release), where credentials
  # already exist.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Install Terraform
        run: |
          set -euo pipefail
          VERSION=1.16.2
          curl -fsSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
          sudo apt-get update && sudo apt-get install -y unzip
          unzip -o /tmp/terraform.zip -d /tmp
          sudo mv /tmp/terraform /usr/local/bin/terraform
          terraform version

      - name: Terraform fmt/validate (changed envs)
        run: |
          set -euo pipefail
          if [ ! -d infra/environments ]; then
            echo "No infra/environments directory; skipping"
            exit 0
          fi

          found=0
          for dir in infra/environments/*; do
            [ -d "$dir" ] || continue
            if ls "$dir"/*.tf >/dev/null 2>&1; then
              found=1
              echo "Running terraform checks in $dir"
              terraform -chdir="$dir" init -backend=false -input=false -get=true -upgrade=false
              terraform -chdir="$dir" fmt -check
              terraform -chdir="$dir" validate
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "No Terraform environment directories with .tf files found"
          fi

  # Deliberately NOT scoped to a GitHub `environment:` -- doing so changes
  # the OIDC sub claim to `environment:<name>` instead of `ref:<ref>`, which
  # would stop matching gha-bloggerbear-dev-deploy's trust condition
  # (`ref:refs/heads/dev`). If a "dev" GitHub Environment is later added for
  # deployment-history visibility, do not reference it on this job unless
  # the IAM trust policy is updated to match.
  apply-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    # TF_VAR_admin_allowed_cidrs: repo-level secret (not a variable) so the
    # operator's real public IP never lands in terraform.tfvars / git
    # history -- see infra/environments/dev/variables.tf's admin_allowed_cidrs
    # description. Must be valid Terraform list-of-strings syntax, e.g.
    # ["203.0.113.7/32"]. Terraform env vars are its lowest-precedence value
    # source, which is exactly why terraform.tfvars must NOT also set this
    # variable (that would silently win over this).
    env:
      TF_VAR_admin_allowed_cidrs: ${{ secrets.ADMIN_ALLOWED_CIDRS_DEV }}
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Install Terraform
        run: |
          set -euo pipefail
          VERSION=1.16.2
          curl -fsSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
          sudo apt-get update && sudo apt-get install -y unzip
          unzip -o /tmp/terraform.zip -d /tmp
          sudo mv /tmp/terraform /usr/local/bin/terraform
          terraform version

      # Repo-level variable (NOT environment-scoped) -- the dev role's OIDC
      # trust condition is ref-based (`ref:refs/heads/dev`), not tied to a
      # GitHub Environment, so this must resolve the same way regardless of
      # whether an "dev" Environment exists.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          aws-region: ap-southeast-2
          role-to-assume: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN }}

      - name: Terraform apply (dev)
        run: |
          set -euo pipefail
          target_dir="infra/environments/dev"

          if [ ! -d "$target_dir" ]; then
            echo "Target environment directory '$target_dir' not found; skipping"
            exit 0
          fi

          if ! ls "$target_dir"/*.tf >/dev/null 2>&1; then
            echo "No Terraform files in '$target_dir'; skipping"
            exit 0
          fi

          echo "Applying terraform in $target_dir"
          plan_file="tfplan"
          terraform -chdir="$target_dir" init
          terraform -chdir="$target_dir" fmt -check
          terraform -chdir="$target_dir" validate
          terraform -chdir="$target_dir" plan -out="$plan_file" -input=false
          terraform -chdir="$target_dir" apply -input=false "$plan_file"
