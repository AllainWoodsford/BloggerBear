name: terraform

# Deploys dev only. Pull requests get their Terraform validate (and secret scan) from
# pr-checks.yml, so a push run here shows just security, lint-test and apply-dev.
on:
  # Everything apply-dev deploys, not just infra/: the Lambdas are packaged from lambdas/ and
  # the site from frontend/ (minified by scripts/minify_frontend.py) by this same apply. With
  # only infra/** here, a merge that changed just code or the site never reached dev.
  push:
    branches: [dev]
    paths:
      - 'infra/**'
      - 'lambdas/**'
      - 'frontend/**'
      - 'scripts/minify_frontend.py'
      - 'scripts/requirements.txt'
      - '.github/workflows/terraform.yml'
      - '.github/workflows/security.yml'
      - '.github/workflows/python-ci.yml'
  # Manual-only: lets apply-dev run with debug_permissions=true without
  # waiting for an actual push to dev. Run this from the Actions tab
  # against the `dev` branch (branch selector must be `dev`, not just the
  # default -- that's what makes the OIDC sub claim `ref:refs/heads/dev`,
  # matching gha-<prefix>-dev-deploy's trust condition, same as the
  # push trigger above).
  workflow_dispatch:
    inputs:
      debug_permissions:
        description: >-
          After apply, query CloudTrail for every AWS API call this run's
          assumed role made (both successful and AccessDenied) and print
          the deduplicated service+action list to the job summary. Use
          this to audit/tighten gha-<prefix>-dev-deploy's IAM policy
          (infra/bootstrap/main.tf) -- e.g. after loosening it to unblock
          a deploy, paste the output back for a review of what's actually
          used vs. just granted.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The same checks a PR gets (Trivy IaC + vuln/secret scans, Bandit; ruff + pytest), run on
  # exactly what is about to be applied, as one workflow run with apply-dev -- the same shape as
  # terraform-production-release.yml. security.yml and python-ci.yml no longer run on their own
  # for a push to dev; they still run on pull requests.
  security:
    uses: ./.github/workflows/security.yml

  lint-test:
    uses: ./.github/workflows/python-ci.yml

  # Deliberately NOT scoped to a GitHub `environment:` -- doing so changes
  # the OIDC sub claim to `environment:<name>` instead of `ref:<ref>`, which
  # would stop matching gha-<prefix>-dev-deploy's trust condition
  # (`ref:refs/heads/dev`). If a "dev" GitHub Environment is later added for
  # deployment-history visibility, do not reference it on this job unless
  # the IAM trust policy is updated to match.
  apply-dev:
    # workflow_dispatch is only ever run manually against the `dev` branch
    # selector (see the trigger comment above) -- github.ref is already
    # 'refs/heads/dev' in that case too, but this doesn't re-check it,
    # since workflow_dispatch has no equivalent of push's "which branch
    # was pushed to" ambiguity to guard against.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || github.event_name == 'workflow_dispatch'
    # A failed scan, lint or test stops the deploy before anything changes.
    needs: [security, lint-test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    # TF_VAR_admin_allowed_cidrs: repo-level secret (not a variable) so the
    # operator's real public IP never lands in terraform.tfvars / git
    # history -- see infra/environments/dev/variables.tf's admin_allowed_cidrs
    # description. Must be valid Terraform list-of-strings syntax, e.g.
    # ["203.0.113.7/32"]. Terraform env vars are its lowest-precedence value
    # source, which is exactly why terraform.tfvars must NOT also set this
    # variable (that would silently win over this).
    # TF_VAR_alert_email: same reasoning as TF_VAR_admin_allowed_cidrs above
    # -- a repo-level secret rather than terraform.tfvars, so the operator's
    # real email never lands in git history. See
    # infra/environments/dev/variables.tf's alert_email description. Unset
    # (empty secret) is fine -- every alarm/subscription it gates is
    # count-gated on `var.alert_email != ""`, so nothing is created without
    # it, same fail-closed-to-"off" pattern as admin_allowed_cidrs' `[]`.
    # TF_VAR_aws_account_id, TF_VAR_unique_name_prefix, TF_STATE_BUCKET: what lets a fork deploy
    # to its own AWS account without editing code (docs/deployment-runsheet.md). All three are
    # optional. Unset, the account ID and the state bucket are empty strings, which Terraform and
    # the init step below both read as "as before": no account check, the state bucket written in
    # the backend block. The account ID and the state bucket's name are secrets, and only secrets:
    # a variable prints in plain text in these public logs, and GitHub masks a secret's text
    # wherever it appears. There is deliberately no `|| vars.` fallback for them (the role ARN and
    # the alert email have one only because they were variables once): a fallback would let the
    # value be set unmasked by mistake, and nothing ever shipped that read them from a variable.
    # TF_VAR_backup_bucket_name is the same state bucket secret again: backups are kept in that
    # bucket, under backup/ (lambdas/common/backup.py), and empty means the backend's default name.
    # TF_VAR_unique_name_prefix is what every resource name starts with (<prefix>-<env>-<what>),
    # from the UNIQUE_NAME_PREFIX variable (a plain variable: it is part of public bucket and
    # sign-in host names anyway). Unset, it is the prefix this project has always used, written
    # out here as the fallback: an empty string would be refused by the variable's validation,
    # and "bloggerbear" is the value its own default already is, so the original deployment's
    # names do not change. It must be the prefix infra/bootstrap was applied with, because the
    # deploy role may only touch resources whose names start with it.
    # scripts/setup_repo.py sets all of them.
    # TF_VAR_waf_regional_enabled, TF_VAR_waf_admin_allowlist, TF_VAR_waf_log_all_requests: the
    # cost-saving firewall switches (docs/cost-saving.md), each from a GitHub variable: the
    # dev-specific one (WAF_..._DEV) if set, else the shared one (WAF_...), else
    # 'true', which is the firewall exactly as it has always been. Plain variables, not secrets:
    # a switch is not a secret, and the Terraform variables are bool, so a typo fails the plan
    # with "a bool is required" instead of silently picking a mode. Turning one off is for a
    # deployment that only tries the project out; a fork that stores real people's data keeps
    # every switch on. The admin API's address allowlist is enforced by its resource policy
    # whatever the switches say.
    # TF_VAR_aws_region, TF_STATE_REGION: the deployment's home region, from the AWS_REGION
    # variable (a plain variable: a region is not a secret, and it is in every ARN and host name
    # the logs print anyway). Unset, it is the region this project has always used, written out
    # here as the fallback, so Terraform is handed the same value its own default already is and
    # the credentials step below gets the region it always got. TF_STATE_REGION is only for the
    # state bucket (see the init step): its own TF_STATE_REGION variable if the bucket is not in
    # the home region, else AWS_REGION, else empty, which leaves the backend block's region alone.
    # TF_VAR_vision_enabled: whether the vision worker (infra/modules/vision-worker, the OpenCV
    # work) is deployed at all. A plain VISION_ENABLED variable, because it is a switch and not a
    # secret. It is read as a switch: `true`, in any letter case (Actions compares strings ignoring
    # case), turns the worker on, and any other value, or none, is handed to Terraform as `false`
    # (also the variable's own default), so a deployment that never set it never creates the
    # worker, and a stray value cannot fail the apply (docs/configuration.md).
    # TF_VAR_reviewer_enabled: whether Professor Grizzlewick, the reviewer bear
    # (lambdas/reviewer_handler.py), is deployed. The opposite reading to VISION_ENABLED: ON unless
    # the REVIEWER_ENABLED variable is `false` (any letter case), so a deployment that never set it
    # gets the bear. Everything else about him is a setting in DynamoDB (`admin_cli reviewer set`).
    # TF_VAR_web_search_region: where the AgentCore web search gateway (infra/modules/web-search)
    # runs: WEB_SEARCH_REGION_DEV if set, else the shared WEB_SEARCH_REGION, else 'ap-northeast-1'
    # (Tokyo), which is the Region it has always been in and the variable's own default. A plain
    # variable: a region is not a secret. The Web Search Tool exists only in us-east-1, eu-west-1
    # and ap-northeast-1, and the plan refuses anything else; the bootstrap's web_search_regions
    # must include it, or the deploy role is refused (docs/configuration.md). Changing it moves
    # the gateway: the next apply replaces it in the new Region.
    env:
      TF_VAR_admin_allowed_cidrs: ${{ secrets.ADMIN_ALLOWED_CIDRS_DEV }}
      TF_VAR_waf_regional_enabled: ${{ vars.WAF_REGIONAL_ENABLED_DEV || vars.WAF_REGIONAL_ENABLED || 'true' }}
      TF_VAR_waf_admin_allowlist: ${{ vars.WAF_ADMIN_ALLOWLIST_DEV || vars.WAF_ADMIN_ALLOWLIST || 'true' }}
      TF_VAR_waf_log_all_requests: ${{ vars.WAF_LOG_ALL_REQUESTS_DEV || vars.WAF_LOG_ALL_REQUESTS || 'true' }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL_DEV || vars.ALERT_EMAIL_DEV }}
      TF_VAR_aws_account_id: ${{ secrets.AWS_DEV_ACCOUNT_ID }}
      TF_VAR_unique_name_prefix: ${{ vars.UNIQUE_NAME_PREFIX || 'bloggerbear' }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET_DEV }}
      TF_VAR_backup_bucket_name: ${{ secrets.TF_STATE_BUCKET_DEV }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION || vars.AWS_REGION }}
      TF_VAR_vision_enabled: ${{ vars.VISION_ENABLED == 'true' && 'true' || 'false' }}
      TF_VAR_reviewer_enabled: ${{ vars.REVIEWER_ENABLED == 'false' && 'false' || 'true' }}
      TF_VAR_web_search_region: ${{ vars.WEB_SEARCH_REGION_DEV || vars.WEB_SEARCH_REGION || 'ap-northeast-1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Install Terraform
        run: |
          set -euo pipefail
          VERSION=1.16.2
          curl -fsSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
          sudo apt-get update && sudo apt-get install -y unzip
          unzip -o /tmp/terraform.zip -d /tmp
          sudo mv /tmp/terraform /usr/local/bin/terraform
          terraform version

      # Recorded before Terraform runs (with a buffer for clock skew
      # between this runner and CloudTrail) so the debug step below knows
      # how far back to look. Only needed for that step, but cheap enough
      # to just always record rather than conditioning this one too.
      - name: Record job start time (for debug_permissions)
        run: echo "JOB_START_TIME=$(date -u -d '-2 minutes' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # Repo-level variable (NOT environment-scoped) -- the dev role's OIDC
      # trust condition is ref-based (`ref:refs/heads/dev`), not tied to a
      # GitHub Environment, so this must resolve the same way regardless of
      # whether an "dev" Environment exists.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
          role-to-assume: ${{ secrets.AWS_DEV_DEPLOY_ROLE_ARN || vars.AWS_DEV_DEPLOY_ROLE_ARN }}

      # Pinned to the same actions/setup-python commit python-ci.yml already uses.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      # Builds frontend-dist/ (frontend/ with .js/.css minified) for
      # infra/environments/dev's frontend_dir to deploy from -- see that
      # local's own comment on why this has to run before apply.
      - name: Minify frontend assets
        run: |
          set -euo pipefail
          pip install -r scripts/requirements.txt
          python scripts/minify_frontend.py

      - name: Terraform apply (dev)
        run: |
          set -euo pipefail
          target_dir="infra/environments/dev"

          if [ ! -d "$target_dir" ]; then
            echo "Target environment directory '$target_dir' not found; skipping"
            exit 0
          fi

          if ! ls "$target_dir"/*.tf >/dev/null 2>&1; then
            echo "No Terraform files in '$target_dir'; skipping"
            exit 0
          fi

          echo "Applying terraform in $target_dir"
          plan_file="tfplan"
          # A fork keeps its state in its own bucket (S3 bucket names are unique across every
          # account, and a backend block cannot read a Terraform variable), so the bucket can be
          # named by the TF_STATE_BUCKET_DEV secret. Unset, this is the plain `init` it always
          # was, against the bucket written in the backend block.
          # The state bucket's region is the same story: the backend block names the original
          # deployment's, and TF_STATE_REGION (the TF_STATE_REGION variable, or else AWS_REGION,
          # since bootstrap puts the bucket in the home region) overrides it. With neither set
          # there is nothing to pass, and this is still the plain `init`.
          init_args=()
          if [ -n "${TF_STATE_BUCKET:-}" ]; then
            init_args+=("-backend-config=bucket=${TF_STATE_BUCKET}")
          fi
          if [ -n "${TF_STATE_REGION:-}" ]; then
            init_args+=("-backend-config=region=${TF_STATE_REGION}")
          fi
          if [ "${#init_args[@]}" -gt 0 ]; then
            terraform -chdir="$target_dir" init "${init_args[@]}"
          else
            terraform -chdir="$target_dir" init
          fi
          terraform -chdir="$target_dir" fmt -check
          terraform -chdir="$target_dir" validate
          terraform -chdir="$target_dir" plan -out="$plan_file" -input=false
          terraform -chdir="$target_dir" apply -input=false "$plan_file"

      # Manual debug aid, not part of the normal deploy path: queries
      # CloudTrail (no dedicated Trail needed -- the default 90-day Event
      # History this account already has is enough, same mechanism used to
      # root-cause the OIDC immutable-subject-claims issue and every
      # AccessDenied gap fixed in #29-#32) for every AWS API call this
      # run's assumed role made since JOB_START_TIME, successful or not,
      # and prints the deduplicated service+action+result list to the job
      # summary. `if: always()` so this still runs and reports what got as
      # far as an AccessDenied even when the apply step above failed --
      # that's the main use case (loosen the policy enough to get further,
      # then paste this output back for a review of what's actually used).
      # gha-<prefix>-dev-deploy needs cloudtrail:LookupEvents for this
      # step to work at all (see infra/bootstrap/main.tf).
      - name: "Debug: required IAM permissions (CloudTrail lookup)"
        if: always() && github.event.inputs.debug_permissions == 'true'
        run: |
          set -euo pipefail
          role_fragment="gha-${TF_VAR_unique_name_prefix}-dev-deploy"

          {
            echo "## Required IAM permissions (CloudTrail, from ${JOB_START_TIME} onward)"
            echo
            echo "CloudTrail can lag a few minutes behind real time -- if this looks incomplete, re-run this step a little later. Each row maps directly to an IAM action (e.g. \`s3.amazonaws.com\` + \`GetAccelerateConfiguration\` -> \`s3:GetAccelerateConfiguration\`); the last column is \`OK\` for a call that succeeded, or the AWS error code (usually \`AccessDenied\`) for one that's still missing a permission."
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          aws cloudtrail lookup-events \
            --start-time "$JOB_START_TIME" \
            --output json \
          | jq -r --arg frag "$role_fragment" '
              .Events[]
              | (.CloudTrailEvent | fromjson) as $e
              | select(($e.userIdentity.arn // "") | contains($frag))
              | "\($e.eventSource)  \($e.eventName)  \($e.errorCode // "OK")"
            ' \
          | sort -u \
          | tee -a "$GITHUB_STEP_SUMMARY"

          echo '```' >> "$GITHUB_STEP_SUMMARY"
