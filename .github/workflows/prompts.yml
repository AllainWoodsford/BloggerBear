name: prompts

# The prompts tree (prompts/, its rules in prompts/README.md): its own gates on a pull request, and
# its own publish to each deployment's prompts bucket, apart from the code's deploys
# (docs/enhancements/model-ranch-prompt-assets-evals.md, sections 2 and 4.2). The repository's
# latest/ folders are the desired state and every publish is a release: scripts/publish_prompts.py
# writes the bucket and the hash table that approves each file, and scripts/prompt_lint.py refuses
# a tree the Lambdas could not serve. Terraform owns the bucket and the table (infra/modules/prompts),
# never what is in them, and the bucket lets only the publisher's role write.
#
# Who publishes where:
#   publish-dev         a push to dev (a merge) that touches the paths below, or a dispatch from dev
#                       asking for dev. In no GitHub environment: gha-<prefix>-dev-prompts trusts
#                       `ref:refs/heads/dev`, and an environment would change the OIDC subject.
#   publish-production  a dispatch from dev asking for production, under `production-prompts` (its
#                       required reviewer is the owner; its deployment branch is dev), and every
#                       published release, under `production`, so prompts and code never drift.
#                       gha-<prefix>-prod-prompts trusts those two environments and no other.
# Both are skipped until the PROMPT_AS_ASSET_ENABLED switch is on (see the gate on each), and
# neither ever runs for a pull request.
on:
  pull_request:
    paths:
      - 'prompts/**'
      - 'lambdas/common/prompts*.py'
      - 'scripts/prompt_lint.py'
      - 'scripts/publish_prompts.py'
      - '.github/workflows/prompts.yml'
  push:
    branches: [dev]
    paths:
      - 'prompts/**'
      - 'lambdas/common/prompts*.py'
      - 'scripts/prompt_lint.py'
      - 'scripts/publish_prompts.py'
      - '.github/workflows/prompts.yml'
  # Run by hand from the Actions tab with the branch selector on dev: a rollback, a pin's clearing,
  # a dry run, or a publish to production between releases.
  # checkov:skip=CKV_GHA_7:The inputs only choose among the publisher's own modes: each reaches the script through env, never the shell, and the publisher refuses a release id that is not one this deployment wrote.
  workflow_dispatch:
    inputs:
      environment:
        description: Which deployment to publish to.
        type: choice
        options: [production, dev]
        default: production
      release_id:
        description: >-
          A rollback: an earlier release of that deployment (such as production-20261026T0304-1a2b3c4,
          from `admin_cli prompts releases`) to publish again and pin. Every later publish, a merge
          or a release included, publishes the pinned one again until a run clears the pin. Empty
          publishes the tree (or the pin, while one is set).
        type: string
        required: false
        default: ''
      clear_pin:
        description: Clear a pinned release and publish the tree as a new release.
        type: boolean
        required: false
        default: false
      dry_run:
        description: Print the plan and write nothing.
        type: boolean
        required: false
        default: false
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The workflow's own gates (section 2 of the spec): the prompt lint, the personal-data denylist,
  # gitleaks and trufflehog, the publisher's and the lint's tests, trivy and checkov. On pull
  # requests only, and with no secret of any kind: nothing a pull request runs here can sign in to
  # AWS or read a repository secret (GITHUB_TOKEN is the run's own read-only token, from the
  # `github` context). A merge is gated by these, and the publish jobs run the lint again on what
  # they publish.
  gates:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Gitleaks lists the pull request's commits.
      pull-requests: read
    steps:
      # Every commit and tag: the lint holds versions to the base's tree and to the latest
      # release's, and the secret scanners read the pull request's own range.
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      # The same commit and Python as python-ci.yml.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      # What python-ci.yml installs, so the two test files below run as they do in the full suite.
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r lambdas/requirements.txt -r lambdas/requirements-dev.txt -r scripts/requirements.txt

      # Every rule the publisher relies on, against this tree, the base's (a version keeps its bytes,
      # and a new one is numbered above every earlier one) and the latest release's registry (what
      # production would skip). It names files, lines and rules, never a prompt's words.
      - name: Prompt lint
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=("--base-ref=$BASE")
          release="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -n "$release" ]; then
            args+=("--release-ref=$release")
          fi
          python scripts/prompt_lint.py "${args[@]}"

      # The operator's exact personal strings are a repository secret, which this job is never
      # given, so here the check reads only a local list (none in CI) and passes with a notice.
      # pr-checks.yml's pii-denylist job runs the same check with the list on every pull request,
      # and each publish job below runs it again, with the list, over the tree it publishes.
      - name: Personal-data denylist
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/pii_denylist_check.py --range "$BASE" "$HEAD"

      # Pinned to the same commits and versions as pr-checks.yml (see the comments there).
      - name: Trufflehog secret scan
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          version: 3.97.4

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Lint and publisher tests
        run: python -m pytest -q scripts/tests/test_prompt_lint.py scripts/tests/test_publish_prompts.py

      # Installed and run the way security.yml does, at the same version and checksum.
      - name: Install Trivy
        run: |
          set -euo pipefail
          VERSION=0.74.0
          SHA256=2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          curl -fsSLo /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz"
          echo "${SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo mv /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: Trivy vulnerability/secret scan (report MEDIUM and up)
        run: |
          trivy fs --scanners vuln,secret --severity MEDIUM,HIGH,CRITICAL --exit-code 0 \
            --skip-dirs '**/.venv,**/venv,**/.terraform,**/node_modules,**/__pycache__,frontend-dist,lambda-build' \
            --file-patterns 'pip:requirements-(dev|ops-mcp|ops-agent|vision|vision-cool)\.txt' \
            .

      - name: Trivy vulnerability/secret scan (fail on HIGH and CRITICAL)
        run: |
          trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs '**/.venv,**/venv,**/.terraform,**/node_modules,**/__pycache__,frontend-dist,lambda-build' \
            --file-patterns 'pip:requirements-(dev|ops-mcp|ops-agent|vision|vision-cool)\.txt' \
            .

      # Installed the way security.yml does, at the same version, and run with the same
      # .checkov.yaml: this workflow (Checkov's github_actions checks: shell injection, unsafe
      # commands, secrets in curl, dispatch inputs) and the module that makes the bucket the
      # publisher writes. security.yml's checkov job scans the whole of infra/ on every pull request.
      - name: Install Checkov
        run: |
          set -euo pipefail
          CHECKOV_VERSION=3.3.25
          python3 -m venv /tmp/checkov-venv
          /tmp/checkov-venv/bin/pip install --quiet "checkov==${CHECKOV_VERSION}"
          sudo ln -sf /tmp/checkov-venv/bin/checkov /usr/local/bin/checkov
          checkov --version

      - name: Checkov (this workflow and the prompts module)
        run: |
          set -euo pipefail
          checkov --config-file .checkov.yaml --framework github_actions --file .github/workflows/prompts.yml
          checkov --config-file .checkov.yaml --directory infra/modules/prompts

  # Dev's prompts, on every merge to dev that touches them (or a dispatch from dev asking for dev).
  #
  # The gate: PROMPT_AS_ASSET_ENABLED, the switch that also has the Lambdas read the bucket
  # (terraform.yml). A job's `if:` is decided before the job enters any environment, so the gate
  # reads the switch at repository level, where dev's deploy reads it too.
  publish-dev:
    if: >-
      vars.PROMPT_AS_ASSET_ENABLED == 'true' && github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # One publish at a time per deployment, and never one cancelled half-way: a later run waits.
    concurrency:
      group: prompts-publish-dev
      cancel-in-progress: false
    env:
      # What the bucket and the table are named from (<prefix>-dev-prompts, <prefix>-dev-prompt-hashes):
      # the deploy's prefix; unset, common/naming.py's default, as Terraform's.
      NAME_PREFIX: ${{ vars.UNIQUE_NAME_PREFIX }}
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      # The operator's personal strings, over every prompt file about to be published: the last
      # look before the text reaches a model, which could repeat it in a public article.
      - name: Personal-data denylist (the tree being published)
        env:
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find prompts -type f -name '*.txt' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No prompt files to check."
            exit 0
          fi
          python3 scripts/pii_denylist_check.py --files "${files[@]}"

      # Pinned to the same commit as terraform.yml's. The role is the publisher's, not the deploy's:
      # the only principal the dev prompts bucket lets write, with rights to that bucket and its hash
      # table and nothing else (infra/bootstrap).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
          role-to-assume: ${{ secrets.AWS_DEV_PROMPTS_ROLE_ARN }}

      # The publisher lints the tree again and refuses on any error, prints the plan, then applies
      # it. The dispatch inputs reach it through env, never the shell's text.
      - name: Publish
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          CLEAR_PIN: ${{ inputs.clear_pin }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--environment dev)
          if [ -n "${RELEASE_ID:-}" ]; then args+=("--release-id=$RELEASE_ID"); fi
          if [ "${CLEAR_PIN:-}" = "true" ]; then args+=(--clear-pin); fi
          if [ "${DRY_RUN:-}" = "true" ]; then args+=(--dry-run); fi
          python scripts/publish_prompts.py "${args[@]}"

  # Production's prompts: by hand from dev under `production-prompts`, or with every published
  # release under `production`. Either way, the owner approves the run before it starts.
  #
  # The gate reads the switch at repository level, as publish-dev's does: a job's `if:` is decided
  # before the job enters its environment. And whatever it reads must be visible from both
  # environments the job runs in, because an environment's own secrets and variables reach only
  # that environment's jobs: AWS_PROD_PROMPTS_ROLE_ARN is a repository secret for that reason
  # (scripts/tests/test_setup_repo.py holds every setting this job reads to repository level).
  publish-production:
    if: >-
      vars.PROMPT_AS_ASSET_ENABLED == 'true' &&
      (github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production' &&
      github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'production' || 'production-prompts' }}
    permissions:
      id-token: write
      contents: read
    # One group for production's bucket, whichever environment a run is in.
    concurrency:
      group: prompts-publish-production
      cancel-in-progress: false
    env:
      NAME_PREFIX: ${{ vars.UNIQUE_NAME_PREFIX }}
    steps:
      # Every commit and tag: the lint's second pass reads the release production runs, in a git
      # worktree. A release's run checks out the release's tag.
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Personal-data denylist (the tree being published)
        env:
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find prompts -type f -name '*.txt' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No prompt files to check."
            exit 0
          fi
          python3 scripts/pii_denylist_check.py --files "${files[@]}"

      # Production runs a release's code, and that release's registry decides what production can
      # read: a published release is that release; a dispatch publishes dev's tree against the
      # latest release. A prompt that release cannot read is left as it is (skip-at-production).
      - name: The release production runs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [ -z "$tag" ]; then
            tag="$(gh release view --json tagName --jq .tagName)" || {
              echo "There is no published release, so production runs no release to publish for." >&2
              exit 1
            }
          fi
          echo "RELEASE_REF=$tag" >> "$GITHUB_ENV"
          echo "Production runs $tag."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
          role-to-assume: ${{ secrets.AWS_PROD_PROMPTS_ROLE_ARN }}

      - name: Publish
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          CLEAR_PIN: ${{ inputs.clear_pin }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--environment production "--release-ref=$RELEASE_REF")
          if [ -n "${RELEASE_ID:-}" ]; then args+=("--release-id=$RELEASE_ID"); fi
          if [ "${CLEAR_PIN:-}" = "true" ]; then args+=(--clear-pin); fi
          if [ "${DRY_RUN:-}" = "true" ]; then args+=(--dry-run); fi
          python scripts/publish_prompts.py "${args[@]}"
