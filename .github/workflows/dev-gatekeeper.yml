name: 🛡️ Dev Quality & Adversarial Security Gate

on:
  pull_request:
    branches:
      - dev    # Triggers on any PR aiming to merge into 'dev'
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write 
  
# Cancel old running jobs if the developer pushes new commits to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: ⬢ Static Security Scans
    runs-on: ubuntu-latest
    steps:
      # Pinned to the same actions/checkout@v4.1.7 commit used everywhere
      # else in this repo's workflows (e.g. terraform.yml) -- was
      # previously the moving `@v4` tag, inconsistent with this repo's
      # own stated SHA-pinning policy against a compromised/mutated tag
      # injecting code into CI.
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      # This project is Python/Terraform, not Node -- there is no
      # package.json anywhere in this repo, so an npm-based lint step here
      # would just fail on `npm ci`. Linting (ruff) and tests (pytest) are
      # already covered by .github/workflows/python-ci.yml, and IaC/secret
      # scanning (trivy, bandit) by .github/workflows/security.yml -- this
      # job only needs the one check that isn't redundant with those.

      # -- FAST SECURITY TRIVIAL CHECK (SAST) --
      # Catch easy hardcoded credentials/secrets before hitting Claude.
      # Bugfix: pinned to trufflesecurity/trufflehog@v3.97.4's release
      # commit -- this was previously `@main`, the literal always-moving
      # development branch tip of a third-party action, run in a job
      # granted contents:write/pull-requests:write/id-token:write. That's
      # exactly the supply-chain risk this repo's SHA-pinning policy
      # exists to prevent.
      - name: Run Trufflehog Secret Scan
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

  adversarial-review:
    name: 🤖 Claude Adversarial AI Review
    needs: static-checks # Only runs if linters & fast scanners pass perfectly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0 # Fetches full history so Claude can see diffs

      # -- MULTI-AGENT ADVERSARIAL REVIEW --
      # Invokes Claude Code in cloud mode to run a deep multi-agent review.
      # Pinned to anthropics/claude-code-action@v1's current release
      # commit, same pinning policy as above.
      - name: Claude Code Guardrail
        uses: anthropics/claude-code-action@9cdae7f0d995e3ba7c33f226087fdf82a59cd520
        with:
          # CLAUDE_CODE_OAUTH_TOKEN is a long-lived token from `claude
          # setup-token` (Pro/Max subscription auth), not an API key -- it
          # goes in `claude_code_oauth_token`, not `anthropic_api_key`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Instructions for Claude go in `prompt` -- `command` isn't a
          # valid input on this action. `/code-review ultra` is the actual
          # invocation for a deep multi-agent review; `--tier`/`--adversarial`
          # aren't flags this skill recognizes.
          prompt: |
            /code-review ultra
