name: python-ci

on:
  pull_request:
    paths:
      - 'lambdas/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/python-ci.yml'
      # The Claude Code skills: scripts/tests/test_claude_skills.py parses the commands each shows
      # against the real CLI, so an edit to a skill alone runs the tests.
      - '.claude/skills/**'
      # The submission's docs: scripts/tests/test_hackathon_docs.py checks the rubric tracker, the
      # report, the diagrams and the reproduction guide, so a docs-only change to them runs it.
      - 'docs/hackathon/**'
  push:
    # Not dev: terraform.yml runs this before apply-dev, in the same workflow run.
    branches: [prod]
    paths:
      - 'lambdas/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/python-ci.yml'
      - '.claude/skills/**'
  # Also called before every apply: by terraform.yml (dev) and by terraform-production-release.yml
  # against the release tag.
  workflow_call:
    inputs:
      ref:
        description: The ref to check out and test (empty means the caller's commit).
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # Lint + test only -- no AWS credentials requested. lambdas/ code under
  # test talks to DynamoDB/S3/Bedrock only via mocks at this stage, and
  # scripts/admin_cli.py's tests mock the HTTP call it makes -- neither
  # needs to authenticate to AWS, so this job never does either.
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          ref: ${{ inputs.ref }}

      # Pinned to the actual v5.6.0 tag commit (actions/setup-python has
      # no v5 moving tag reliably resolvable without a live lookup at
      # authoring time -- pin the same way actions/checkout is pinned
      # elsewhere in this repo's workflows).
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ ! -d lambdas ]; then
            echo "lambdas/ not present; skipping"
            exit 0
          fi
          python -m pip install --upgrade pip
          if [ -f lambdas/requirements.txt ]; then
            pip install -r lambdas/requirements.txt
          fi
          if [ -f lambdas/requirements-dev.txt ]; then
            pip install -r lambdas/requirements-dev.txt
          fi
          if [ -f scripts/requirements.txt ]; then
            pip install -r scripts/requirements.txt
          fi

      # Prints only: the exact environment the tests ran in. The submission's constraints-py311.txt
      # is this output, copied from a run on R2's pull request before the tag (nothing runs this
      # workflow on a tag; docs/hackathon/dependencies.md).
      - name: Print the installed packages
        run: pip freeze --all

      - name: Ruff lint
        run: |
          set -euo pipefail
          if [ ! -d lambdas ]; then
            echo "lambdas/ not present; skipping"
            exit 0
          fi
          if ruff check lambdas/ scripts/; then
            exit 0
          fi

          echo "Ruff failed; retrying with automatic fixes."
          if ruff check --fix lambdas/ scripts/; then
            if git diff --quiet -- lambdas/ scripts/; then
              echo "Ruff passed on retry without changing files."
              exit 0
            fi
          fi

          {
            echo "### Ruff auto-fix"
            echo "Ruff's automatic fixes are shown below. Apply them to the branch and rerun CI."
            echo '```diff'
            git diff -- lambdas/ scripts/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Ruff remains blocking; apply any reported fixes to the branch and rerun CI." >&2
          exit 1

      # The whole suite, across the runner's CPUs (pytest-xdist, lambdas/requirements-dev.txt).
      # `loadfile` keeps each test file on one worker, so module-level state and fixtures behave as
      # in a serial run; no file is big enough to unbalance it (the slowest is ~10% of the time).
      # Every test still runs: this job is also the gate before every deploy.
      - name: Pytest
        run: |
          set -euo pipefail
          if [ ! -d lambdas ]; then
            echo "lambdas/ not present; skipping"
            exit 0
          fi
          pytest lambdas/ scripts/ -n auto --dist loadfile
