name: python-ci

on:
  pull_request:
    paths:
      - 'lambdas/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/python-ci.yml'
  push:
    # Not dev: terraform.yml runs this before apply-dev, in the same workflow run.
    branches: [prod]
    paths:
      - 'lambdas/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/python-ci.yml'
  # Also called before every apply: by terraform.yml (dev) and by terraform-production-release.yml
  # against the release tag.
  workflow_call:
    inputs:
      ref:
        description: The ref to check out and test (empty means the caller's commit).
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # Lint + test only -- no AWS credentials requested. lambdas/ code under
  # test talks to DynamoDB/S3/Bedrock only via mocks at this stage, and
  # scripts/admin_cli.py's tests mock the HTTP call it makes -- neither
  # needs to authenticate to AWS, so this job never does either.
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          ref: ${{ inputs.ref }}

      # Pinned to the actual v5.6.0 tag commit (actions/setup-python has
      # no v5 moving tag reliably resolvable without a live lookup at
      # authoring time -- pin the same way actions/checkout is pinned
      # elsewhere in this repo's workflows).
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ ! -d lambdas ]; then
            echo "lambdas/ not present; skipping"
            exit 0
          fi
          python -m pip install --upgrade pip
          if [ -f lambdas/requirements.txt ]; then
            pip install -r lambdas/requirements.txt
          fi
          if [ -f lambdas/requirements-dev.txt ]; then
            pip install -r lambdas/requirements-dev.txt
          fi
          if [ -f scripts/requirements.txt ]; then
            pip install -r scripts/requirements.txt
          fi

      - name: Ruff lint
        run: |
          set -euo pipefail
          if [ ! -d lambdas ]; then
            echo "lambdas/ not present; skipping"
            exit 0
          fi
          if ruff check lambdas/ scripts/; then
            exit 0
          fi

          echo "Ruff failed; retrying with automatic fixes."
          if ruff check --fix lambdas/ scripts/; then
            if git diff --quiet -- lambdas/ scripts/; then
              echo "Ruff passed on retry without changing files."
              exit 0
            fi
          fi

          {
            echo "### Ruff auto-fix"
            echo "Ruff's automatic fixes are shown below. Apply them to the branch and rerun CI."
            echo '```diff'
            git diff -- lambdas/ scripts/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Ruff remains blocking; apply any reported fixes to the branch and rerun CI." >&2
          exit 1

      - name: Pytest
        run: |
          set -euo pipefail
          if [ ! -d lambdas ]; then
            echo "lambdas/ not present; skipping"
            exit 0
          fi
          pytest lambdas/ scripts/
