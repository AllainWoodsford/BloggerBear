name: pr-checks

# Checks that only make sense on a pull request, kept out of the apply workflows so a push or
# release run shows just what it actually does (security, lint-test, apply) and no skipped boxes.
# security.yml and python-ci.yml also run on every PR, as their own workflows.
on:
  pull_request:

permissions:
  contents: read

jobs:
  # Terraform syntax/format/schema for every environment, before merge (apply-dev and the
  # production release run init/fmt/validate again themselves, just before they plan).
  #
  # Read-only: deliberately does NOT authenticate to AWS. GitHub's OIDC subject claim for a
  # pull_request-triggered job is `repo:<owner>/<repo>:pull_request`, which matches neither
  # deploy role's trust condition (gha-bloggerbear-dev-deploy trusts `ref:refs/heads/dev`;
  # gha-bloggerbear-prod-deploy trusts `environment:production`), and there is deliberately no
  # third role for this. So no `terraform plan` here: this config reads
  # data.aws_caller_identity.current and the AWS provider validates credentials on init, so a
  # plan cannot succeed without live AWS access. Real plan diffs happen at apply time, where
  # credentials already exist. (Moved here from terraform.yml.)
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Install Terraform
        run: |
          set -euo pipefail
          VERSION=1.16.2
          curl -fsSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
          sudo apt-get update && sudo apt-get install -y unzip
          unzip -o /tmp/terraform.zip -d /tmp
          sudo mv /tmp/terraform /usr/local/bin/terraform
          terraform version

      - name: Terraform fmt/validate (every environment)
        run: |
          set -euo pipefail
          for dir in infra/environments/*; do
            [ -d "$dir" ] || continue
            if ls "$dir"/*.tf >/dev/null 2>&1; then
              echo "Running terraform checks in $dir"
              terraform -chdir="$dir" init -backend=false -input=false -get=true -upgrade=false
              terraform -chdir="$dir" fmt -check
              terraform -chdir="$dir" validate
            fi
          done

      # validate checks types, not values: an expression that only fails once real values flow
      # through it (the edge dashboard's "Inconsistent conditional result types") passes validate
      # and breaks the apply. A module's tests/*.tftest.hcl plan it with a mocked AWS provider --
      # no credentials -- which evaluates those expressions the way a real plan does.
      - name: Terraform test (modules with tests)
        run: |
          set -euo pipefail
          for dir in infra/modules/*; do
            if ls "$dir"/tests/*.tftest.hcl >/dev/null 2>&1; then
              echo "Running terraform test in $dir"
              terraform -chdir="$dir" init -backend=false -input=false
              terraform -chdir="$dir" test
            fi
          done

  # Secrets in what the pull request adds, between its base and head commits, in any file (a
  # key can land in a script, the frontend or a doc, which the Trivy secret scan in
  # security.yml -- lambdas/ only -- would not see). Moved here from security.yml.
  # Pinned to trufflesecurity/trufflehog@v3.97.4's release commit (not the moving @main).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      - name: Trufflehog secret scan
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

  # Gitleaks over the pull request's commits: its default secret rules, plus email addresses and
  # AWS account IDs (.gitleaks.toml). Trufflehog verifies live credentials; this catches personal
  # data no secret scanner looks for (docs/friction.md 7.11). Findings are redacted by the action
  # (`--redact`), so the log and job summary never repeat what they found. PR comments and the
  # SARIF artifact are off: comments need write access, and the artifact adds nothing to the
  # summary. pull-requests: read lets the action list the PR's commits.
  # Pinned to gitleaks/gitleaks-action@v3.0.0's release commit; the gitleaks binary to 8.30.1.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  # The operator's exact personal strings (a name, a home IP, a personal address), from the
  # PII_DENYLIST repository secret, so the list itself is never written anywhere public. Only
  # what the PR adds is checked, and a finding names the file, line and entry number -- never the
  # entry. With the secret unset this passes with a notice. PRs are limited to collaborators, so
  # every PR runs with access to the secret.
  pii-denylist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      - name: Personal-data denylist
        env:
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/pii_denylist_check.py --range "$BASE" "$HEAD"
