name: security

on:
  # Every PR, whatever it touches: secret-scan below has to see all of it (a key can land in a
  # script, the frontend or a doc). The Trivy/Bandit job takes well under a minute.
  pull_request:
  # Also called before every apply, so nothing is deployed that these scans would have stopped on
  # a PR: by terraform.yml's apply-dev (a push to dev; it no longer runs on its own for that) and
  # by terraform-production-release.yml against the release tag.
  workflow_call:
    inputs:
      ref:
        description: The ref to check out and scan (empty means the caller's commit).
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          ref: ${{ inputs.ref }}

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Install Bandit
        run: |
          BANDIT_VERSION=1.7.10
          python3 -m pip install --upgrade pip "bandit==${BANDIT_VERSION}"

      - name: Trivy IaC scan
        run: |
          if [ -d infra ]; then
            # Bugfix: these three paths must point at the actual
            # .terraform provider/module cache directories (one per root:
            # bootstrap, dev, production) -- NOT infra/bootstrap itself.
            # The previous list ("infra/bootstrap,infra/.terraform,
            # infra/environments/.terraform") skipped the entire
            # infra/bootstrap directory (missing its /.terraform suffix),
            # silently excluding main.tf/variables.tf/outputs.tf -- the
            # OIDC trust policies and the broadest IAM grants in this
            # repo -- from every IaC security scan ever run. The other
            # two entries didn't match any real path at all (the actual
            # cache dirs are one level deeper, per-environment), so they
            # were no-ops.
            trivy config --severity HIGH,CRITICAL --exit-code 1 \
              --skip-dirs infra/bootstrap/.terraform,infra/environments/dev/.terraform,infra/environments/production/.terraform \
              infra/
          else
            echo "infra/ not present; skipping IaC scan"
          fi

      - name: Trivy vulnerability/secret scan
        run: |
          if [ -d lambdas ]; then
            trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 \
              --skip-dirs lambdas/.venv,lambdas/venv,lambdas/node_modules,lambdas/dist,lambdas/build \
              lambdas/
          else
            echo "lambdas/ not present; skipping fs scan"
          fi

      - name: Bandit scan
        run: |
          if [ -d lambdas ]; then
            bandit -r lambdas/ --severity-level high --confidence-level high
          else
            echo "lambdas/ not present; skipping bandit"
          fi

  # Secrets in what a pull request adds, between its base and head commits. Moved here from the
  # retired dev-gatekeeper.yml. Pull requests only: the base/head range is what it scans, and an
  # apply's run (push, release) has none -- the Trivy secret scan above covers those.
  # Pinned to trufflesecurity/trufflehog@v3.97.4's release commit (not the moving @main).
  secret-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      - name: Trufflehog secret scan
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
