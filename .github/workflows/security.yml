name: security

on:
  # Every PR, whatever it touches; it takes well under a minute. (The Trufflehog secret scan of
  # a PR's own commits is in pr-checks.yml.)
  pull_request:
  # Also called before every apply, so nothing is deployed that these scans would have stopped on
  # a PR: by terraform.yml's apply-dev (a push to dev; it no longer runs on its own for that) and
  # by terraform-production-release.yml against the release tag.
  workflow_call:
    inputs:
      ref:
        description: The ref to check out and scan (empty means the caller's commit).
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          ref: ${{ inputs.ref }}

      # Pinned and checksum-verified, like the actions: the apt repo installed whatever was newest.
      # The SHA-256 is written here, not fetched from the release, so a swapped file fails too.
      - name: Install Trivy
        run: |
          set -euo pipefail
          VERSION=0.74.0
          SHA256=2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          curl -fsSLo /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz"
          echo "${SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo mv /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: Install Bandit
        run: |
          BANDIT_VERSION=1.7.10
          python3 -m pip install --upgrade pip "bandit==${BANDIT_VERSION}"

      - name: Trivy IaC scan
        run: |
          if [ -d infra ]; then
            # Bugfix: these three paths must point at the actual
            # .terraform provider/module cache directories (one per root:
            # bootstrap, dev, production) -- NOT infra/bootstrap itself.
            # The previous list ("infra/bootstrap,infra/.terraform,
            # infra/environments/.terraform") skipped the entire
            # infra/bootstrap directory (missing its /.terraform suffix),
            # silently excluding main.tf/variables.tf/outputs.tf -- the
            # OIDC trust policies and the broadest IAM grants in this
            # repo -- from every IaC security scan ever run. The other
            # two entries didn't match any real path at all (the actual
            # cache dirs are one level deeper, per-environment), so they
            # were no-ops.
            trivy config --severity HIGH,CRITICAL --exit-code 1 \
              --skip-dirs infra/bootstrap/.terraform,infra/environments/dev/.terraform,infra/environments/production/.terraform \
              infra/
          else
            echo "infra/ not present; skipping IaC scan"
          fi

      # The whole repo, not just lambdas/: scripts/requirements.txt (the admin CLI) and the secret
      # scan of frontend/, infra/, scripts/, docs/ and .github/ were never covered. Trivy only
      # recognises files named exactly requirements.txt, so --file-patterns adds the dev, ops-mcp
      # and ops-agent requirements. The secret table lists only files with findings: a clean run
      # shows just the dependency files, with "-" under Secrets.
      #
      # First every MEDIUM-or-worse finding, reported without failing (a MEDIUM CVE used to pass
      # unseen), then the gate on HIGH and CRITICAL.
      - name: Trivy vulnerability/secret scan (report MEDIUM and up)
        run: |
          trivy fs --scanners vuln,secret --severity MEDIUM,HIGH,CRITICAL --exit-code 0 \
            --skip-dirs '**/.venv,**/venv,**/.terraform,**/node_modules,**/__pycache__,frontend-dist,lambda-build' \
            --file-patterns 'pip:requirements-(dev|ops-mcp|ops-agent)\.txt' \
            .

      - name: Trivy vulnerability/secret scan (fail on HIGH and CRITICAL)
        run: |
          trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs '**/.venv,**/venv,**/.terraform,**/node_modules,**/__pycache__,frontend-dist,lambda-build' \
            --file-patterns 'pip:requirements-(dev|ops-mcp|ops-agent)\.txt' \
            .

      # lambdas/ and scripts/ (the admin CLI signs AWS requests; it was never scanned). Tests are
      # excluded: their thousands of `assert`s (B101) buried the real figures.
      - name: Bandit scan
        run: |
          bandit -r lambdas/ scripts/ -x lambdas/tests,scripts/tests \
            --severity-level high --confidence-level high
