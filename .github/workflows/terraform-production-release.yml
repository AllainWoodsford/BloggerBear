name: terraform-production-release

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  # The same checks a PR into dev gets (Trivy IaC + vuln/secret scans, Bandit; ruff + pytest), run
  # again on exactly what is being released. Until these, a release applied production with no
  # checks of its own. `apply` needs both, so a failure stops the deploy before anything changes.
  security:
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ github.event.release.tag_name }}

  lint-test:
    uses: ./.github/workflows/python-ci.yml
    with:
      ref: ${{ github.event.release.tag_name }}

  apply:
    needs: [security, lint-test]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # TF_VAR_admin_allowed_cidrs: a `production`-Environment-scoped secret
    # (not a repo-level one, and not a variable) so the operator's real
    # public IP never lands in terraform.tfvars / git history -- see
    # infra/environments/production/variables.tf's admin_allowed_cidrs
    # description. Must be valid Terraform list-of-strings syntax, e.g.
    # ["203.0.113.7/32"]. Terraform env vars are its lowest-precedence value
    # source, which is exactly why terraform.tfvars must NOT also set this
    # variable (that would silently win over this).
    # TF_VAR_alert_email: same reasoning as TF_VAR_admin_allowed_cidrs above
    # -- a `production`-Environment-scoped secret rather than
    # terraform.tfvars, so the operator's real email never lands in git
    # history. See infra/environments/production/variables.tf's alert_email
    # description. Unset (empty secret) is fine -- count-gated on
    # `var.alert_email != ""`, same fail-closed-to-"off" pattern as
    # admin_allowed_cidrs' `[]`.
    # TF_VAR_aws_account_id, TF_VAR_unique_name_prefix, TF_STATE_BUCKET: the same three optional
    # settings as terraform.yml's apply-dev job (see the comment there), with production's own
    # account ID and state bucket (both secrets, with no variable fallback), so production can
    # live in a different AWS account from dev. Unset, the account ID and the bucket are empty
    # and the prefix is "bloggerbear", and nothing changes.
    # TF_VAR_aws_region, TF_STATE_REGION: the home region and the state bucket's region, as in
    # terraform.yml (see the comment there). This job runs in the `production` environment, so
    # an AWS_REGION or TF_STATE_REGION variable set on that environment wins over the
    # repository's; unset in both, the region is the one this project has always used.
    env:
      TF_VAR_admin_allowed_cidrs: ${{ secrets.ADMIN_ALLOWED_CIDRS_PROD }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL_PROD || vars.ALERT_EMAIL_PROD }}
      TF_VAR_aws_account_id: ${{ secrets.AWS_PROD_ACCOUNT_ID }}
      TF_VAR_unique_name_prefix: ${{ vars.UNIQUE_NAME_PREFIX || 'bloggerbear' }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET_PROD }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION || vars.AWS_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      # Guardrail: only allow a release to apply production if the released
      # commit is actually reachable from `prod`'s tip. This protects
      # against cutting a release from the wrong branch (e.g. accidentally
      # tagging a commit on `dev`).
      #
      # NOTE: deliberately NOT using `github.sha` here — for `release`
      # events GitHub sets that to the default branch's tip, not the
      # tag's commit. We check out the release tag explicitly above and
      # resolve its actual commit via `git rev-parse HEAD` instead.
      - name: Verify release commit is on prod
        run: |
          set -euo pipefail
          git fetch origin prod
          release_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$release_sha" origin/prod || (echo "Release commit is not on prod branch" && exit 1)

      # A secret, not a variable: the trust policy is what protects the role,
      # but a variable prints in plain text in every step's log, and these
      # logs are public on a public repo. The `|| vars.` fallback covers the
      # move from variable to secret; drop it once the variable is deleted.
      # `environment: production` above is what makes the
      # OIDC sub claim `environment:production`, matching
      # gha-<prefix>-prod-deploy's trust condition -- and gates this job
      # behind that environment's required-reviewer approval.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
          role-to-assume: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN || vars.AWS_PROD_DEPLOY_ROLE_ARN }}

      - name: Install Terraform
        run: |
          set -euo pipefail
          VERSION=1.16.2
          curl -fsSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
          sudo apt-get update && sudo apt-get install -y unzip
          unzip -o /tmp/terraform.zip -d /tmp
          sudo mv /tmp/terraform /usr/local/bin/terraform
          terraform version

      # Pinned to the same actions/setup-python commit python-ci.yml already uses.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      # Builds frontend-dist/ (frontend/ with .js/.css minified) for
      # infra/environments/production's frontend_dir to deploy from -- see
      # that local's own comment on why this has to run before apply.
      - name: Minify frontend assets
        run: |
          set -euo pipefail
          pip install -r scripts/requirements.txt
          python scripts/minify_frontend.py

      - name: Terraform apply (production)
        run: |
          set -euo pipefail
          target_dir="infra/environments/production"

          if [ ! -d "$target_dir" ]; then
            echo "Target environment directory '$target_dir' not found; skipping"
            exit 0
          fi

          if ! ls "$target_dir"/*.tf >/dev/null 2>&1; then
            echo "No Terraform files in '$target_dir'; skipping"
            exit 0
          fi

          echo "Applying terraform in $target_dir"
          plan_file="tfplan"
          # A fork keeps its state in its own bucket (S3 bucket names are unique across every
          # account, and a backend block cannot read a Terraform variable), so the bucket can be
          # named by the TF_STATE_BUCKET_PROD secret. Unset, this is the plain `init` it always
          # was, against the bucket written in the backend block.
          # The state bucket's region is the same story: the backend block names the original
          # deployment's, and TF_STATE_REGION (the TF_STATE_REGION variable, or else AWS_REGION,
          # since bootstrap puts the bucket in the home region) overrides it. With neither set
          # there is nothing to pass, and this is still the plain `init`.
          init_args=()
          if [ -n "${TF_STATE_BUCKET:-}" ]; then
            init_args+=("-backend-config=bucket=${TF_STATE_BUCKET}")
          fi
          if [ -n "${TF_STATE_REGION:-}" ]; then
            init_args+=("-backend-config=region=${TF_STATE_REGION}")
          fi
          if [ "${#init_args[@]}" -gt 0 ]; then
            terraform -chdir="$target_dir" init "${init_args[@]}"
          else
            terraform -chdir="$target_dir" init
          fi
          terraform -chdir="$target_dir" fmt -check
          terraform -chdir="$target_dir" validate
          terraform -chdir="$target_dir" plan -out="$plan_file" -input=false
          terraform -chdir="$target_dir" apply -input=false "$plan_file"
