name: terraform-production-release

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      # Guardrail: only allow a release to apply production if the released
      # commit is actually reachable from `prod`'s tip. This protects
      # against cutting a release from the wrong branch (e.g. accidentally
      # tagging a commit on `dev`).
      #
      # NOTE: deliberately NOT using `github.sha` here — for `release`
      # events GitHub sets that to the default branch's tip, not the
      # tag's commit. We check out the release tag explicitly above and
      # resolve its actual commit via `git rev-parse HEAD` instead.
      - name: Verify release commit is on prod
        run: |
          set -euo pipefail
          git fetch origin prod
          release_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$release_sha" origin/prod || (echo "Release commit is not on prod branch" && exit 1)

      # Set as a `production` GitHub Environment variable (not a secret --
      # the role ARN itself isn't sensitive, the trust policy is what
      # protects it). `environment: production` above is what makes the
      # OIDC sub claim `environment:production`, matching
      # gha-bloggerbear-prod-deploy's trust condition -- and gates this job
      # behind that environment's required-reviewer approval.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          aws-region: ap-southeast-2
          role-to-assume: ${{ vars.AWS_PROD_DEPLOY_ROLE_ARN }}

      - name: Install Terraform
        run: |
          set -euo pipefail
          VERSION=1.16.2
          curl -fsSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
          sudo apt-get update && sudo apt-get install -y unzip
          unzip -o /tmp/terraform.zip -d /tmp
          sudo mv /tmp/terraform /usr/local/bin/terraform
          terraform version

      - name: Terraform apply (production)
        run: |
          set -euo pipefail
          target_dir="infra/environments/production"

          if [ ! -d "$target_dir" ]; then
            echo "Target environment directory '$target_dir' not found; skipping"
            exit 0
          fi

          if ! ls "$target_dir"/*.tf >/dev/null 2>&1; then
            echo "No Terraform files in '$target_dir'; skipping"
            exit 0
          fi

          echo "Applying terraform in $target_dir"
          plan_file="tfplan"
          terraform -chdir="$target_dir" init
          terraform -chdir="$target_dir" fmt -check
          terraform -chdir="$target_dir" validate
          terraform -chdir="$target_dir" plan -out="$plan_file" -input=false
          terraform -chdir="$target_dir" apply -input=false "$plan_file"
