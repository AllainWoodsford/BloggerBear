name: 🤖 Claude Issue Worker
on:
  issues:
    types: [opened, labeled]

# Grant permissions so Claude can write comments on your issues and create PRs
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write 
jobs:
  run-claude:
    # Triggers if the issue description contains '@claude' OR if you add a 'claude' label
    if: contains(github.event.issue.labels.*.name, 'claude') || contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      # Pinned to the same actions/checkout@v4.1.7 commit used everywhere
      # else in this repo's workflows -- see terraform.yml etc. for the
      # stated policy (SHA-pinning, not a moving tag, to prevent a
      # compromised/mutated tag from injecting code into CI).
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Run Claude Task
        # Pinned to anthropics/claude-code-action@v1's current release
        # commit, same pinning policy as above.
        uses: anthropics/claude-code-action@9cdae7f0d995e3ba7c33f226087fdf82a59cd520
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Bugfix: `command` is not a valid input on this action --
          # instructions go in `prompt`.
          prompt: |
            /run-task-from-issue "${{ github.event.issue.number }}"
