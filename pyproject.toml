[tool.pytest.ini_options]
# Lets `pytest lambdas/ scripts/` (run from the repo root) discover and
# import both packages' test suites in a single invocation -- each of
# lambdas/ and scripts/ also keeps its own pyproject.toml (with the same
# pythonpath/testpaths shape) so `pytest` run from *within* either directory
# still works standalone, e.g. for editors/IDEs.
pythonpath = ["lambdas", "scripts"]
testpaths = ["lambdas/tests", "scripts/tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
# lambdas/ and scripts/ each carry their own [tool.ruff] table (in their own
# pyproject.toml) with matching settings; this root table is only what
# applies when ruff is pointed at both directories in one invocation from
# the repo root, e.g. `ruff check lambdas/ scripts/`.
extend-exclude = ["infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
