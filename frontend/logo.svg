<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="bloggerbear-logo-title">
  <title id="bloggerbear-logo-title">BloggerBear placeholder logo</title>
  <!-- Placeholder mark: a solid square badge (self-contained fill, so it
       stays legible against both the light and dark page themes) with a
       simple bear-silhouette monogram. Swap this file for a real logo
       whenever one exists; nothing else references its internal
       shapes, only its file name. (Deliberately no double hyphens
       anywhere in this comment: that sequence is invalid inside an XML
       comment and breaks strict SVG parsers, even though browsers
       tolerate it.) -->
  <rect width="64" height="64" rx="12" fill="#2a5db0" />
  <circle cx="20" cy="20" r="7" fill="#ffffff" />
  <circle cx="44" cy="20" r="7" fill="#ffffff" />
  <circle cx="32" cy="36" r="18" fill="#ffffff" />
  <circle cx="25" cy="34" r="2.6" fill="#2a5db0" />
  <circle cx="39" cy="34" r="2.6" fill="#2a5db0" />
  <circle cx="32" cy="42" r="3.4" fill="#2a5db0" />
</svg>
