<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloggerBear</title>
  <link rel="stylesheet" href="styles.css" />
  <!--
    The RSS feed lives on the public API's origin, not this static site's --
    this placeholder href is rewritten to the real absolute URL by
    app.js's fixRssLinks() once window.PUBLIC_API_URL is available
    (config.js runs before app.js, see below).
  -->
  <link rel="alternate" type="application/rss+xml" title="BloggerBear RSS Feed" href="/rss.xml" />
</head>
<body>
  <header>
    <a class="site-title" href="#/">BloggerBear</a>
    <nav id="nav" aria-label="Topics"></nav>
  </header>
  <main id="content">
    <p>Loading...</p>
  </main>
  <footer class="site-footer">
    <a id="rss-link" href="/rss.xml">RSS</a>
  </footer>

  <!-- Generated by infra (Terraform) at deploy time; sets window.PUBLIC_API_URL and window.SITE_URL. -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
