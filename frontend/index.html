<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloggerBear</title>
  <!--
    normalize.css loads first, as a baseline: if styles.css fails to load
    for any reason (network hiccup, a misconfigured deploy, a browser
    extension blocking it, ...), the page still gets consistent, sane
    cross-browser defaults instead of raw unstyled HTML. styles.css loads
    second and builds on top of it. Both are vendored locally rather than
    pulled from a CDN -- depending on a third party to deliver the
    fallback for "our own styles didn't load" would defeat the point.
  -->
  <link rel="stylesheet" href="normalize.css" />
  <link rel="stylesheet" href="styles.css" />
  <!--
    Three-tier favicon: modern browsers use the scalable SVG; anything
    that doesn't understand SVG icons falls back to the classic ICO
    (still what most browsers/crawlers request from /favicon.ico by
    convention, regardless of <link> tags, so it exists as a real file
    too, not just this rel="alternate icon" reference); apple-touch-icon
    is what iOS/iPadOS uses for home-screen bookmarks. All three are
    generated from the same source mark (frontend/logo.svg).
  -->
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <!--
    The RSS feed lives on the public API's origin, not this static site's --
    this placeholder href is rewritten to the real absolute URL by
    app.js's fixRssLinks() once window.PUBLIC_API_URL is available
    (config.js runs before app.js, see below).
  -->
  <link rel="alternate" type="application/rss+xml" title="BloggerBear RSS Feed" href="/rss.xml" />
</head>
<body>
  <!--
    Skip link: the first focusable thing on the page for keyboard/screen-
    reader users, letting them jump straight past both nav regions below
    to the actual content. Visually hidden until focused (see styles.css)
    -- a standard WCAG 2.4.1 (Bypass Blocks) pattern.
  -->
  <a class="skip-link" href="#content">Skip to content</a>

  <header>
    <a class="site-title" href="#/">
      <picture>
        <source srcset="logo.webp" type="image/webp" />
        <img class="site-logo" src="logo.svg" alt="" width="32" height="32" />
      </picture>
      BloggerBear
    </a>
    <nav id="nav" aria-label="Topics"></nav>
  </header>

  <!--
    Site notice: not a cookie-consent banner in the usual sense -- this
    site doesn't use cookies (see the Privacy Policy for how that's
    verified) -- just an honest, upfront notice about the anonymous view
    counting and infrastructure-level security logging this site does do.
    Placed in-flow, right below the header (not a fixed overlay), so it
    can never obscure content further down the page; it simply pushes
    everything below it down while visible. Hidden by default; app.js
    shows it once per browser (via localStorage, the one and only thing
    this site stores client-side) unless already dismissed.
  -->
  <div id="site-notice" class="site-notice" role="region" aria-label="Site notice" hidden>
    <p>
      This site doesn't use cookies. It does keep anonymous per-article view
      counts and basic infrastructure security logs to keep things running.
      <a href="#/privacy">Privacy Policy</a>
    </p>
    <button type="button" id="site-notice-dismiss" aria-label="Dismiss this notice">Got it</button>
  </div>

  <main id="content" tabindex="-1">
    <p>Loading...</p>
  </main>
  <footer class="site-footer">
    <nav class="legal-nav" aria-label="Legal">
      <a href="#/terms">Terms of Service</a>
      <a href="#/privacy">Privacy Policy</a>
    </nav>
    <a id="rss-link" href="/rss.xml" aria-label="Subscribe to the site-wide RSS feed">RSS</a>
  </footer>

  <!-- Generated by infra (Terraform) at deploy time; sets window.PUBLIC_API_URL and window.SITE_URL. -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
